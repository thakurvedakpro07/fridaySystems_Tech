<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block subject %}ResolveHQ{% endblock %}</title>
  <style>
    body { margin: 0; padding: 0; background: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; }
    .wrapper { max-width: 580px; margin: 32px auto; background: #ffffff; border-radius: 12px; overflow: hidden; border: 1px solid #e2e8f0; }
    .accent { height: 4px; background: linear-gradient(90deg, #4f46e5, #7c3aed); }
    .header { padding: 28px 32px 20px; border-bottom: 1px solid #f1f5f9; }
    .logo { display: flex; align-items: center; gap: 8px; text-decoration: none; }
    .logo-icon { width: 32px; height: 32px; background: linear-gradient(135deg, #4f46e5, #7c3aed); border-radius: 8px; display: flex; align-items: center; justify-content: center; }
    .logo-text { font-size: 16px; font-weight: 700; color: #0f172a; }
    .body { padding: 28px 32px; }
    .footer { padding: 20px 32px; background: #f8fafc; border-top: 1px solid #f1f5f9; }
    .footer p { margin: 0; font-size: 12px; color: #94a3b8; line-height: 1.6; }
    h1 { margin: 0 0 16px; font-size: 20px; font-weight: 700; color: #0f172a; }
    p { margin: 0 0 14px; font-size: 14px; color: #475569; line-height: 1.7; }
    .meta-box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 16px; margin: 20px 0; }
    .meta-row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 13px; }
    .meta-label { color: #94a3b8; font-weight: 500; }
    .meta-value { color: #1e293b; font-weight: 600; }
    .cta-btn { display: inline-block; background: #4f46e5; color: #ffffff; text-decoration: none; padding: 12px 24px; border-radius: 8px; font-size: 14px; font-weight: 600; margin: 8px 0; }
    .cta-btn:hover { background: #4338ca; }
    .status-badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: #e0e7ff; color: #4338ca; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="accent"></div>
    <div class="header">
      <div class="logo">
        <div class="logo-icon">
          <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="white" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z" />
          </svg>
        </div>
        <span class="logo-text">ResolveHQ</span>
      </div>
    </div>
    <div class="body">
      {% block content %}{% endblock %}
    </div>
    <div class="footer">
      <p>You received this email because you have an account with ResolveHQ.<br>
      ResolveHQ — From Issue to Resolution.<br>
      © 2026 Powered by Friday Tech Systems. Made in India 🇮🇳</p>
    </div>
  </div>
</body>
</html>
