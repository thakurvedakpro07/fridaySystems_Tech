<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="X-UA-Compatible" content="IE=edge" />
<meta name="color-scheme" content="light dark" />
<meta name="supported-color-schemes" content="light dark" />
<title>{% block subject %}ResolveHQ{% endblock %}</title>
<!--[if mso]>
<noscript>
<xml>
<o:OfficeDocumentSettings>
<o:PixelsPerInch>96</o:PixelsPerInch>
<o:AllowPNG/>
</o:OfficeDocumentSettings>
</xml>
</noscript>
<style>
  table, td { font-family: Arial, sans-serif !important; }
</style>
<![endif]-->
<style>
  body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
  table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
  img { -ms-interpolation-mode: bicubic; border: 0; outline: none; text-decoration: none; }
  body { margin: 0; padding: 0; width: 100% !important; height: 100% !important; background: #F3F4F8; }
  a { color: #5B5CEB; }
  h1 { margin: 0 0 14px; font-size: 22px; line-height: 1.35; font-weight: 700; color: #101828; font-family: 'Segoe UI', Inter, Arial, Helvetica, sans-serif; }
  p { margin: 0 0 14px; font-size: 15px; line-height: 1.65; color: #475569; font-family: 'Segoe UI', Inter, Arial, Helvetica, sans-serif; }
  .muted { color: #98A2B3; font-size: 12px; line-height: 1.6; }

  /* Gmail (web + apps) injects its own default link-blue for <a> tags with higher effective
     priority than an ordinary inline `color`. "u + .body" only matches inside Gmail's own
     rendering DOM (it wraps message content directly after an empty <u></u> marker — a
     long-documented, Gmail-specific artifact other clients don't produce), so this rule is a
     no-op everywhere except Gmail, where it forces the CTA button back to white. */
  u + .body .btn-link, u + .body .btn-link span, u + .body .btn-link font { color: #ffffff !important; text-decoration: none !important; }

  @media only screen and (max-width: 600px) {
    .wrapper { width: 100% !important; }
    .card-pad { padding-left: 20px !important; padding-right: 20px !important; }
  }

  @media (prefers-color-scheme: dark) {
    body, .email-bg { background: #0B0B14 !important; }
    .card { background: #17171F !important; }
    .card-border { border-color: #2A2A38 !important; }
    h1, .logo-text { color: #F3F4F6 !important; }
    p, .muted { color: #9BA0AC !important; }
    .card a { color: #8B8FF0 !important; }
    .card a.btn-link { color: #ffffff !important; }
    .info-card { background: #1E1E29 !important; border-color: #2A2A38 !important; }
    .info-card td { color: #C7CAD6 !important; }
    .info-card .ic-label { color: #8B90A0 !important; }
    .security-notice { background: #1B1A2E !important; }
    .divider-line { border-color: #2A2A38 !important; }
    .footer-card p { color: #6B7080 !important; }
    .social-dot { background: #2A2A38 !important; color: #6B7080 !important; }
  }
  [data-ogsc] body, [data-ogsc] .email-bg { background: #0B0B14 !important; }
  [data-ogsc] .card { background: #17171F !important; }
  [data-ogsc] h1, [data-ogsc] .logo-text { color: #F3F4F6 !important; }
  [data-ogsc] p { color: #9BA0AC !important; }
  [data-ogsc] .card a.btn-link { color: #ffffff !important; }
</style>
</head>
<body class="email-bg" style="margin:0;padding:0;background:#F3F4F8;">
<div style="display:none;font-size:1px;line-height:1px;max-height:0;max-width:0;opacity:0;overflow:hidden;mso-hide:all;font-family:'Segoe UI',Inter,Arial,sans-serif;">
{% block preheader %}{% endblock %}&#8203;&#8203;&#8203;&#8203;&#8203;&#8203;&#8203;&#8203;&#8203;&#8203;&#8203;&#8203;&#8203;&#8203;&#8203;&#8203;&#8203;&#8203;&#8203;&#8203;
</div>
<u></u><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="email-bg body" style="background:#F3F4F8;">
<tr>
<td align="center" style="padding:40px 16px;">

  <!-- Card -->
  <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" class="wrapper" style="width:600px;max-width:600px;">
    <tr>
      <td class="card card-border" style="background:#FFFFFF;border:1px solid #E7E8F0;border-radius:16px;box-shadow:0 1px 2px rgba(16,24,40,0.04),0 4px 12px rgba(16,24,40,0.06);overflow:hidden;">

        <!-- Accent bar -->
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr>
          <td style="height:4px;line-height:4px;font-size:0;background:#5B5CEB;" bgcolor="#5B5CEB">&nbsp;</td>
        </tr></table>

        <!-- Logo header -->
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr>
          <td class="card-pad" style="padding:26px 32px 18px;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>
              <td width="34" valign="middle">
                <table role="presentation" width="32" height="32" cellpadding="0" cellspacing="0" border="0" style="background:#5B5CEB;border-radius:9px;" bgcolor="#5B5CEB">
                  <tr><td align="center" valign="middle" style="width:32px;height:32px;color:#ffffff;font-size:16px;font-weight:700;font-family:'Segoe UI',Inter,Arial,sans-serif;">R</td></tr>
                </table>
              </td>
              <td class="logo-text" valign="middle" style="padding-left:10px;font-size:17px;font-weight:700;color:#101828;font-family:'Segoe UI',Inter,Arial,sans-serif;">ResolveHQ</td>
            </tr></table>
          </td>
        </tr></table>

        <!-- Content -->
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr>
          <td class="card-pad" style="padding:2px 32px 34px;">
            {% block content %}{% endblock %}
          </td>
        </tr></table>

      </td>
    </tr>
  </table>
  <!-- /Card -->

  <!-- Footer -->
  <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" class="wrapper footer-card" style="width:600px;max-width:600px;margin-top:24px;">
    <tr><td align="center" style="padding:0 24px;">

      <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 auto 14px;"><tr>
        <td style="padding:0 4px;"><a href="#" class="social-dot" style="display:inline-block;width:26px;height:26px;border-radius:50%;background:#E7E8F0;color:#98A2B3;font-size:11px;font-weight:600;line-height:26px;text-align:center;text-decoration:none;font-family:Arial,sans-serif;">in</a></td>
        <td style="padding:0 4px;"><a href="#" class="social-dot" style="display:inline-block;width:26px;height:26px;border-radius:50%;background:#E7E8F0;color:#98A2B3;font-size:11px;font-weight:600;line-height:26px;text-align:center;text-decoration:none;font-family:Arial,sans-serif;">X</a></td>
        <td style="padding:0 4px;"><a href="#" class="social-dot" style="display:inline-block;width:26px;height:26px;border-radius:50%;background:#E7E8F0;color:#98A2B3;font-size:11px;font-weight:600;line-height:26px;text-align:center;text-decoration:none;font-family:Arial,sans-serif;">@</a></td>
      </tr></table>

      <p style="margin:0 0 4px;font-size:13px;font-weight:700;color:#344054;font-family:'Segoe UI',Inter,Arial,sans-serif;">ResolveHQ</p>
      <p style="margin:0 0 10px;font-size:12px;color:#98A2B3;font-family:'Segoe UI',Inter,Arial,sans-serif;">Issue Resolution Platform &middot; Made in India 🇮🇳</p>
      <p style="margin:0 0 10px;font-size:12px;color:#98A2B3;font-family:'Segoe UI',Inter,Arial,sans-serif;">
        Support: <a href="mailto:{{ support_email }}" style="color:#5B5CEB;text-decoration:none;">{{ support_email }}</a>
        &nbsp;&middot;&nbsp;
        <a href="{{ app_url }}" style="color:#5B5CEB;text-decoration:none;">resolvehq.in</a>
      </p>
      <p style="margin:0;font-size:11px;color:#B3B8C2;font-family:'Segoe UI',Inter,Arial,sans-serif;">&copy; {% now "Y" %} ResolveHQ, a product of Friday Tech Systems. All rights reserved.</p>

    </td></tr>
  </table>
  <!-- /Footer -->

</td>
</tr>
</table>
</body>
</html>
