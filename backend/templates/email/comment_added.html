{% extends "email/base.html" %}
{% block content %}
<h1>New Reply on Your Ticket 💬</h1>
<p>Hi {{ email }},</p>
<p>{{ commenter_email }} has added a reply to your support ticket.</p>
<div class="meta-box">
  <div class="meta-row">
    <span class="meta-label">Ticket</span>
    <span class="meta-value">{{ ticket_number }}</span>
  </div>
  <div class="meta-row">
    <span class="meta-label">From</span>
    <span class="meta-value">{{ commenter_email }}</span>
  </div>
</div>
<div style="background:#f8fafc;border-left:3px solid #4f46e5;padding:12px 16px;border-radius:0 8px 8px 0;margin:16px 0;">
  <p style="margin:0;font-size:14px;color:#334155;font-style:italic;">{{ comment_preview }}</p>
</div>
<a href="{{ app_url }}/tickets/{{ ticket_id }}" class="cta-btn">View & Reply →</a>
{% endblock %}
