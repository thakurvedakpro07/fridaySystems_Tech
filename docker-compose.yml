# ─────────────────────────────────────────────────────────────────
# docker-compose.yml  —  LOCAL DEVELOPMENT
#
# Starts 6 services that talk to each other over a private network:
#   db          → PostgreSQL database
#   redis       → Redis (Celery task queue + caching)
#   backend     → Django API (port 8000)
#   celery      → Celery worker (processes background tasks)
#   celerybeat  → Celery Beat scheduler (recurring tasks)
#   frontend    → React/Vite dev server (port 5173)
# ─────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ──────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: supportmitra
      POSTGRES_PASSWORD: supportmitra
      POSTGRES_DB: supportmitra
    volumes:
      # persist database data between docker compose restarts
      - postgres_data:/var/lib/postgresql/data
    ports:
      # expose port so you can connect with a DB GUI (e.g. TablePlus)
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supportmitra"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Postgres startup can take well over a minute after a non-graceful
      # stop (mandatory data-directory fsync + WAL crash recovery), but
      # interval*retries alone only gives 50s before Docker marks the
      # container unhealthy. Without start_period, that race aborted
      # `docker compose up` with "dependency failed to start: db is
      # unhealthy" even though Postgres was recovering normally.
      start_period: 90s

  # ── Redis ────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      # Persist Redis data so Celery task results and cache survive restarts.
      # Without this, every `docker compose down` wipes the queue and cache.
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Django Backend ───────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      # FIXED: was "- .env" which pointed at a non-existent root-level file.
      # backend/.env is where SECRET_KEY, DATABASE_URL, REDIS_URL, etc. live.
      - backend/.env
    ports:
      - "8000:8000"
    volumes:
      # Mount source code so Gunicorn's --reload picks up your edits
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: sh -c "python manage.py collectstatic --noinput && python manage.py migrate && gunicorn supportmitra.wsgi:application --bind 0.0.0.0:8000 --reload --workers 2"

  # ── Celery Worker ────────────────────────────────────────────────
  # Picks up background tasks (emails, SLA checks, etc.)
  celery:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      # FIXED: same env_file path correction as backend
      - backend/.env
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A supportmitra worker --loglevel=info
    healthcheck:
      # Dockerfile.backend bakes in an HTTP healthcheck against :8000, which
      # doesn't apply here — this container runs no web server. Overriding
      # it with a real functional check: `inspect ping` round-trips through
      # the broker and confirms the worker is actually consuming tasks, not
      # just alive.
      test: ["CMD-SHELL", "celery -A supportmitra inspect ping --timeout=5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── Celery Beat (Scheduler) ──────────────────────────────────────
  # Fires recurring tasks on a schedule (e.g. SLA breach checks every 5 min)
  celerybeat:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      # FIXED: same env_file path correction as backend
      - backend/.env
    volumes:
      - ./backend:/app
    depends_on:
      - celery
    command: celery -A supportmitra beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    healthcheck:
      # Same override rationale as `celery` above. Beat has no RPC ping to
      # ask a broker-side question, so this instead confirms PID 1 in the
      # container is actually the beat scheduler process (liveness, not a
      # functional check) — image has no `ps`, but /proc is always there.
      test: ["CMD-SHELL", "grep -q beat /proc/1/cmdline"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── React Frontend ───────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      # ADDED: tells Vite's proxy where to forward /api/* requests.
      # Inside Docker, "localhost" means the frontend container itself —
      # not the Django container. "backend" is the Docker service name,
      # which Docker's private DNS resolves to the backend container's IP.
      # vite.config.js reads this via process.env.VITE_API_TARGET and
      # falls back to http://localhost:8000 when running without Docker.
      VITE_API_TARGET: http://backend:8000
      # Google OAuth — passed at Vite serve time so import.meta.env.VITE_GOOGLE_CLIENT_ID
      # is defined in the browser bundle. The value here must match the one in
      # frontend/.env so local (non-Docker) npm run dev also works.
      VITE_GOOGLE_CLIENT_ID: "1036476300436-0a9n8v77uao0g8beum2utsscti7e412c.apps.googleusercontent.com"
    ports:
      - "5173:5173"
    volumes:
      # Mount source so Vite's HMR (hot reload) works without a rebuild
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    depends_on:
      backend:
        condition: service_healthy

# ── Named Volumes ────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
