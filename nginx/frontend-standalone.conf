# nginx config for the fully-containerized frontend (Dockerfile.frontend.prod).
#
# Mirrors the security headers and CSP from the primary deployment's nginx/nginx.conf
# exactly, so this container is no less hardened just because it's used as an
# alternative to the host-nginx deploy. This container has no TLS of its own — it's
# meant to run behind a TLS-terminating proxy/load balancer, which is why it listens
# on plain port 80. The Strict-Transport-Security header is still set here so it
# passes through to clients if that fronting proxy forwards response headers as-is
# (browsers ignore HSTS received over a plain HTTP connection, so it is a no-op if
# this container is ever exposed directly over HTTP).

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers — kept identical to nginx/nginx.conf ────────────────
    add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options     "nosniff"                                      always;
    add_header X-Frame-Options            "DENY"                                         always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin"              always;
    add_header Permissions-Policy         "geolocation=(), microphone=(), camera=()"     always;
    add_header X-XSS-Protection           "1; mode=block"                               always;
    add_header Cross-Origin-Opener-Policy "same-origin"                                  always;

    # Content-Security-Policy — see nginx/nginx.conf for the full script-src/style-src
    # rationale (Razorpay checkout.js needs no script-src 'unsafe-inline'; style-src
    # 'unsafe-inline' is kept because checkout.js sets the style attribute directly).
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self' https://checkout.razorpay.com https://cdn.razorpay.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; connect-src 'self' https://api.razorpay.com https://lumberjack.razorpay.com; frame-src https://api.razorpay.com; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; form-action 'self';"
        always;

    # Forward all API calls to the Django backend container
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback — every unmatched path serves index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-lived cache for hashed asset filenames.
    # nginx only inherits add_header directives from the server block if this
    # location defines none of its own — since Cache-Control is set here, the
    # security headers above must be repeated or they'd silently disappear
    # from every JS/CSS/font response.
    location ~* \.(js|css|woff2|woff|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control            "public, immutable";
        add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options     "nosniff"                                      always;
        add_header X-Frame-Options            "DENY"                                         always;
        add_header Referrer-Policy            "strict-origin-when-cross-origin"              always;
        add_header Permissions-Policy         "geolocation=(), microphone=(), camera=()"     always;
        add_header X-XSS-Protection           "1; mode=block"                               always;
        add_header Cross-Origin-Opener-Policy "same-origin"                                  always;
        add_header Content-Security-Policy
            "default-src 'self'; script-src 'self' https://checkout.razorpay.com https://cdn.razorpay.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; connect-src 'self' https://api.razorpay.com https://lumberjack.razorpay.com; frame-src https://api.razorpay.com; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; form-action 'self';"
            always;
    }
}
