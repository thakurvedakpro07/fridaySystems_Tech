# ─────────────────────────────────────────────────────────────────────────────
# nginx.conf — SupportMitra Production Reverse Proxy
#
# This file runs on the HOST machine (not in Docker). It:
#   1. Listens on port 80 and redirects all traffic to HTTPS (port 443)
#   2. Terminates SSL/TLS using a Let's Encrypt certificate
#   3. Serves the compiled React frontend as static files
#   4. Proxies /api/* and /admin/* requests to the Django backend container
#   5. Serves Django's collected static/media files
#
# SETUP:
#   1. Install nginx:  sudo apt install nginx
#   2. Install certbot: sudo apt install certbot python3-certbot-nginx
#   3. Copy this file:  sudo cp nginx/nginx.conf /etc/nginx/sites-available/supportmitra
#   4. Enable site:     sudo ln -s /etc/nginx/sites-available/supportmitra /etc/nginx/sites-enabled/
#   5. Get SSL cert:    sudo certbot --nginx -d supportmitra.in -d www.supportmitra.in
#   6. Reload nginx:    sudo systemctl reload nginx
# ─────────────────────────────────────────────────────────────────────────────

# ── Redirect HTTP → HTTPS ─────────────────────────────────────────────────────
server {
    listen 80;
    server_name supportmitra.in www.supportmitra.in;

    # Let's Encrypt ACME challenge (needed for cert renewal)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Main HTTPS Server ─────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name supportmitra.in www.supportmitra.in;

    # ── SSL Certificate (managed by certbot) ─────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/supportmitra.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/supportmitra.in/privkey.pem;

    # Modern SSL settings (TLS 1.2+ only)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Security Headers ──────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff"                                      always;
    add_header X-Frame-Options           "DENY"                                         always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()"     always;

    # ── Gzip Compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;

    # ── Rate Limiting ─────────────────────────────────────────────────────────
    # Define zones at the http block level (in /etc/nginx/nginx.conf):
    #   limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    #   limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
    limit_req zone=api burst=50 nodelay;

    # Stricter limit for auth endpoints
    location ~* ^/api/auth/(login|register|token) {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Django API ────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 10M;          # allow file uploads up to 10 MB
    }

    # ── Django Admin Panel ────────────────────────────────────────────────────
    location /django-admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Django Prometheus Metrics (restrict to localhost only) ────────────────
    location /metrics {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:8000;
    }

    # ── Django Static Files (collected by collectstatic) ─────────────────────
    location /static/ {
        alias /home/deploy/supportmitra/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── Django Media Files (user uploads) ────────────────────────────────────
    location /media/ {
        alias /home/deploy/supportmitra/backend/mediafiles/;
        expires 7d;
    }

    # ── React Frontend (compiled static files) ────────────────────────────────
    # After `npm run build`, dist/ contains index.html + hashed JS/CSS bundles.
    root /home/deploy/supportmitra/frontend/dist;

    location / {
        try_files $uri $uri/ /index.html;   # React Router — all routes serve index.html
    }

    # Cache hashed JS/CSS bundles forever (filename changes on each build)
    location ~* \.(js|css|woff2|woff|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cache images
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public";
    }
}
