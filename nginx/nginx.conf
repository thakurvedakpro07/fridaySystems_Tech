# ─────────────────────────────────────────────────────────────────────────────
# nginx.conf — SupportMitra Production Reverse Proxy
#
# Architecture:
#   Internet → Nginx (host, port 80/443)
#                ├── /api/*         → Django container (127.0.0.1:8000)
#                ├── /django-admin/ → Django container (127.0.0.1:8000)
#                ├── /static/       → served from disk (collectstatic output)
#                ├── /media/        → served from disk (user uploads)
#                └── /*             → React SPA (frontend/dist/)
#
# First-time setup on the VPS:
#   1. sudo apt install nginx certbot python3-certbot-nginx
#   2. sudo cp nginx/nginx.conf /etc/nginx/nginx.conf
#   3. sudo nginx -t && sudo systemctl reload nginx
#   4. sudo certbot --nginx -d resolvehq.in -d www.resolvehq.in
#   5. sudo systemctl reload nginx
# ─────────────────────────────────────────────────────────────────────────────

worker_processes auto;            # matches CPU core count automatically
worker_rlimit_nofile 65535;       # maximum open file descriptors per worker

events {
    worker_connections 1024;
    use epoll;                    # efficient I/O multiplexing on Linux
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Performance ──────────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;          # batch TCP packets when using sendfile
    tcp_nodelay        on;          # minimise latency for small responses
    keepalive_timeout  65;
    keepalive_requests 100;

    # ── Security ─────────────────────────────────────────────────────────────
    server_tokens      off;         # hide nginx version in headers and error pages

    # ── Upstream: Django/Gunicorn ─────────────────────────────────────────────
    # Named upstream block keeps proxy_pass URLs DRY and allows load balancing
    # if you ever add a second backend instance.
    upstream django {
        server 127.0.0.1:8000;
        keepalive 32;               # reuse connections to the upstream process
    }

    # ── Gzip Compression ─────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_buffers      16 8k;
    gzip_http_version 1.1;
    gzip_min_length   256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml
        font/truetype
        font/opentype
        application/vnd.ms-fontobject;

    # ── Rate Limiting Zones ───────────────────────────────────────────────────
    # Zones must be defined in the http block — not allowed in server/location.
    limit_req_zone $binary_remote_addr zone=api:10m   rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m  rate=5r/m;
    limit_req_zone $binary_remote_addr zone=upload:5m rate=10r/m;

    # Return 429 on rate limit (default is 503)
    limit_req_status 429;

    # ── Logging format ────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" $request_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
    server {
        listen 80;
        server_name resolvehq.in www.resolvehq.in;

        # Let's Encrypt ACME challenge — needed for cert renewal
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── Main HTTPS server ─────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name resolvehq.in www.resolvehq.in;

        # ── SSL certificate (managed by certbot) ─────────────────────────────
        ssl_certificate     /etc/letsencrypt/live/resolvehq.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/resolvehq.in/privkey.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        # OCSP stapling — reduces TLS handshake latency
        ssl_stapling        on;
        ssl_stapling_verify on;
        resolver            8.8.8.8 8.8.4.4 valid=300s;
        resolver_timeout    5s;

        # ── Security headers ─────────────────────────────────────────────────
        add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options     "nosniff"                                      always;
        add_header X-Frame-Options            "DENY"                                         always;
        add_header Referrer-Policy            "strict-origin-when-cross-origin"              always;
        add_header Permissions-Policy         "geolocation=(), microphone=(), camera=()"     always;
        add_header X-XSS-Protection           "1; mode=block"                               always;
        add_header Cross-Origin-Opener-Policy "same-origin"                                  always;

        # Content-Security-Policy:
        #   script-src: 'unsafe-inline' removed — React build, Razorpay checkout.js, and
        #     Django admin templates contain no inline <script> content, inline event
        #     handlers, or javascript: URIs (verified by static inspection of the
        #     production checkout.js bundle and Vite build output). cdn.razorpay.com
        #     is required because checkout.js loads a risk-detection sub-script from it.
        #   style-src: 'unsafe-inline' KEPT — Razorpay's checkout.js calls
        #     element.setAttribute("style", <dynamic string>) for widget positioning/
        #     theming, which a nonce/hash cannot cover (third-party script, not under
        #     our control, with content that varies per render). React's own JSX
        #     style={{...}} usage does not require it (sets CSSOM properties directly,
        #     not the style attribute string) — confirmed via live render testing.
        #     fonts.googleapis.com added for the Google Fonts stylesheet in index.html.
        #   connect-src: Razorpay API calls + lumberjack analytics
        #   frame-src: Razorpay payment iframe
        #   font-src: fonts.gstatic.com for the Google Fonts files themselves
        add_header Content-Security-Policy
            "default-src 'self'; script-src 'self' https://checkout.razorpay.com https://cdn.razorpay.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; connect-src 'self' https://api.razorpay.com https://lumberjack.razorpay.com; frame-src https://api.razorpay.com; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; form-action 'self';"
            always;

        # ── Proxy defaults (shared by all proxy_pass locations) ───────────────
        proxy_http_version      1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";  # enable keepalive to upstream

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Buffering: small responses go straight through; large ones buffer
        proxy_buffering       on;
        proxy_buffer_size     4k;
        proxy_buffers         8 8k;
        proxy_busy_buffers_size 16k;

        # ── Auth endpoints (stricter rate limit) ─────────────────────────────
        # Covers login/register/token refresh plus password-reset and
        # verify-email-resend — those used to fall through to the much
        # looser general `api` zone below (30r/s vs 5r/m here), relying on
        # DRF's AuthRateThrottle alone at the application layer.
        location ~* ^/api/auth/(login|register|token|password/reset|verify-email/resend) {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://django;
        }

        # ── File upload endpoints (rate-limited separately) ───────────────────
        location ~* ^/api/(tickets|attachments) {
            limit_req zone=upload burst=5 nodelay;
            client_max_body_size 10M;
            proxy_pass http://django;
            proxy_read_timeout 120s;   # allow time for large file uploads
        }

        # ── General Django API ────────────────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://django;
        }

        # ── Django Admin Panel ────────────────────────────────────────────────
        location /django-admin/ {
            proxy_pass http://django;
        }

        # ── Prometheus metrics (localhost only — not public) ──────────────────
        location /metrics {
            allow 127.0.0.1;
            deny all;
            proxy_pass http://django;
        }

        # ── WebSocket support (future-ready for Django Channels) ─────────────
        # Uncomment when adding real-time notifications via Channels:
        # location /ws/ {
        #     proxy_pass http://django;
        #     proxy_http_version 1.1;
        #     proxy_set_header Upgrade    $http_upgrade;
        #     proxy_set_header Connection "upgrade";
        #     proxy_read_timeout 86400s;  # keep WS connections open for 24h
        # }

        # ── Django collected static files ─────────────────────────────────────
        # Path: /opt/supportmitra/backend/staticfiles/ (or Docker volume mount)
        location /static/ {
            alias   /opt/supportmitra/backend/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # ── User-uploaded media files ──────────────────────────────────────────
        # Path: /opt/supportmitra/backend/mediafiles/ (or Docker volume mount)
        location /media/ {
            alias   /opt/supportmitra/backend/mediafiles/;
            expires 7d;
            add_header Cache-Control "public";
            add_header X-Content-Type-Options "nosniff" always;
            access_log off;
        }

        # ── React SPA ──────────────────────────────────────────────────────────
        root /opt/supportmitra/frontend/dist;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # Cache hashed JS/CSS filenames forever (Vite adds a hash on each build)
        location ~* \.(js|css|woff2|woff|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Shorter cache for images (may change without filename hash)
        location ~* \.(png|jpg|jpeg|gif|ico|webp|svg)$ {
            expires 30d;
            add_header Cache-Control "public";
            access_log off;
        }
    }
}
