# ─────────────────────────────────────────────────────────────────────────────
# nginx.conf — SupportMitra Production Reverse Proxy
#
# COMPLETE nginx.conf (events + http blocks) so rate-limit zones are properly
# defined in the http block. Deploy as:
#   sudo cp nginx/nginx.conf /etc/nginx/nginx.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# SETUP:
#   1. Install nginx:   sudo apt install nginx
#   2. Install certbot: sudo apt install certbot python3-certbot-nginx
#   3. Copy this file:  sudo cp nginx/nginx.conf /etc/nginx/nginx.conf
#   4. Get SSL cert:    sudo certbot --nginx -d supportmitra.in -d www.supportmitra.in
#   5. Reload nginx:    sudo systemctl reload nginx
# ─────────────────────────────────────────────────────────────────────────────

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;
    server_tokens off;  # hide nginx version from error pages and Server header

    # ── Rate Limiting Zones ───────────────────────────────────────────────────
    # Must live in the http block — limit_req_zone is not allowed in server/location.
    #
    # zone=api:   30 req/s per IP for general API traffic (burst of 50)
    # zone=auth:  5 req/min per IP for login/register/token endpoints (burst of 10)
    limit_req_zone $binary_remote_addr zone=api:10m  rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

    # ── Redirect HTTP → HTTPS ─────────────────────────────────────────────────
    server {
        listen 80;
        server_name supportmitra.in www.supportmitra.in;

        # Let's Encrypt ACME challenge (needed for cert renewal)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── Main HTTPS Server ─────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name supportmitra.in www.supportmitra.in;

        # ── SSL Certificate (managed by certbot) ─────────────────────────────
        ssl_certificate     /etc/letsencrypt/live/supportmitra.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/supportmitra.in/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_stapling on;
        ssl_stapling_verify on;

        # ── Security Headers ──────────────────────────────────────────────────
        add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options     "nosniff"                                      always;
        add_header X-Frame-Options            "DENY"                                         always;
        add_header Referrer-Policy            "strict-origin-when-cross-origin"              always;
        add_header Permissions-Policy         "geolocation=(), microphone=(), camera=()"     always;
        add_header X-XSS-Protection           "1; mode=block"                               always;
        add_header Cross-Origin-Opener-Policy "same-origin"                                  always;

        # Content-Security-Policy:
        #   script-src allows Razorpay checkout.js loaded dynamically by PaymentGateway.jsx
        #   connect-src allows Razorpay API calls and lumberjack analytics
        #   frame-src allows the Razorpay payment iframe
        add_header Content-Security-Policy
            "default-src 'self'; script-src 'self' 'unsafe-inline' https://checkout.razorpay.com; style-src 'self' 'unsafe-inline'; connect-src 'self' https://api.razorpay.com https://lumberjack.razorpay.com; frame-src https://api.razorpay.com; img-src 'self' data: blob:; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self';"
            always;

        # ── Gzip Compression ──────────────────────────────────────────────────
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
        gzip_min_length 1024;

        # ── Global API rate limit (applied to all locations in this server) ───
        limit_req zone=api burst=50 nodelay;

        # ── Stricter limit for auth endpoints ─────────────────────────────────
        location ~* ^/api/auth/(login|register|token) {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Django API ────────────────────────────────────────────────────────
        location /api/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            client_max_body_size 10M;
        }

        # ── Django Admin Panel ────────────────────────────────────────────────
        location /django-admin/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Prometheus Metrics (localhost only) ───────────────────────────────
        location /metrics {
            allow 127.0.0.1;
            deny all;
            proxy_pass http://127.0.0.1:8000;
        }

        # ── Django Static Files ───────────────────────────────────────────────
        location /static/ {
            alias /home/deploy/supportmitra/backend/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # ── Django Media Files (user uploads) ─────────────────────────────────
        location /media/ {
            alias /home/deploy/supportmitra/backend/mediafiles/;
            expires 7d;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # ── React Frontend ────────────────────────────────────────────────────
        root /home/deploy/supportmitra/frontend/dist;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # Cache hashed JS/CSS bundles forever (filename changes on each build)
        location ~* \.(js|css|woff2|woff|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Cache images
        location ~* \.(png|jpg|jpeg|gif|ico|webp)$ {
            expires 30d;
            add_header Cache-Control "public";
        }
    }
}
